
sonar.projectName=GestiLab
sonar.sourceEncoding=UTF-8

# Codigo fuente
sonar.sources=inventario-service/src/main/java,prestamos-service/src/main/java,cliente/src

# Pruebas automatizadas
sonar.tests=inventario-service/src/test/java,prestamos-service/src/test/java,cliente/src
sonar.test.inclusions=**/src/test/java/**/*.java,**/*.spec.ts,**/*.test.ts

# Exclusiones de archivos generados y pruebas
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/target/**,**/dist/**,**/coverage/**

# Configuracion Java
sonar.java.source=21
sonar.java.binaries=inventario-service/target/classes,prestamos-service/target/classes
sonar.java.test.binaries=inventario-service/target/test-classes,prestamos-service/target/test-classes
sonar.java.libraries=inventario-service/target/sonar-libs/*.jar,prestamos-service/target/sonar-libs/*.jar
sonar.java.test.libraries=inventario-service/target/sonar-libs/*.jar,prestamos-service/target/sonar-libs/*.jar

# Cobertura de los microservicios Java
sonar.coverage.jacoco.xmlReportPaths=inventario-service/target/site/jacoco/jacoco.xml,prestamos-service/target/site/jacoco/jacoco.xml

# Cobertura del cliente Angular
sonar.javascript.lcov.reportPaths=cliente/coverage/cliente/lcov.info

# Resultados de las pruebas Java
sonar.junit.reportPaths=inventario-service/target/surefire-reports,prestamos-service/target/surefire-reports

# Puerta de calidad
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

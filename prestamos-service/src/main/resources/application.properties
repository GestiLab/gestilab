spring.application.name=prestamos-service
api.version=v1
server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15434/prestamos_db}
spring.datasource.username=${DB_USERNAME:devdb}
spring.datasource.password=${DB_PASSWORD:devdb}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.pool-name=PrestamosHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
# Sin esto la conexión queda retenida durante toda la petición, también mientras se espera a inventario
spring.jpa.open-in-view=false

# JSON estricto: sin esto {"unidadId":14.9} presta la unidad 14 y la basura tras el JSON se ignora
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator en puerto propio (ver tabla de puertos del README raíz): /salud
management.server.port=8091
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=salud
management.endpoints.web.exposure.include=health

# Cliente HTTP de inventario (CA-4, CA-5): otra dirección o tiempo = otra variable de entorno, no otro código.
# La URL incluye el prefijo de la API; timeout aplica a la conexión y a la espera de respuesta.
inventario.url=${INVENTARIO_URL:http://localhost:8080/api/v1/inventario-service}
inventario.timeout=${INVENTARIO_TIMEOUT:3s}

# Seguridad (SCRUM-20): se valida el token que emite Keycloak y se leen los roles de realm_access.roles.
# issuer es el "iss" que trae el token; jwk-set-uri es de dónde se descargan las claves públicas.
# Con el servicio en un contenedor no coinciden (ver keycloak/README.md): se cambian por variable de entorno.
# La descarga de claves es perezosa: el servicio arranca aunque Keycloak todavía no responda.
gestilab.seguridad.issuer=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gestilab}
gestilab.seguridad.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gestilab}/protocol/openid-connect/certs}

logging.level.com.tedesoft.prestamosservice=DEBUG

# Conexion con RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}


# Nombres del inventario
gestilab.rabbitmq.unidad.exchange=gestilab.unidades.eventos
gestilab.rabbitmq.unidad.routing-key=unidad.estado.cambiado


# Confirmar que RabbitMQ recibió el mensaje
spring.rabbitmq.publisher-confirm-type=correlated

# Detectar mensajes que no llegan a ninguna cola
spring.rabbitmq.publisher-returns=true

# Solicitar devolución de mensajes sin destino
spring.rabbitmq.template.mandatory=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Con el buzón de eventos, un broker caído no impide operar: /salud no debe marcar el servicio como caído
management.health.rabbit.enabled=false

# El buzón de eventos pendientes se procesa solo; las pruebas con H2 lo apagan
gestilab.eventos.procesador.habilitado=true
gestilab.rabbitmq.unidad.reintento-ms=5000

# Fotografías en almacenamiento compatible con S3
gestilab.fotos.s3.habilitado=${FOTOS_S3_HABILITADO:false}
gestilab.fotos.s3.bucket=${FOTOS_S3_BUCKET:}
gestilab.fotos.s3.region=${AWS_REGION:us-east-1}
gestilab.fotos.s3.endpoint=${FOTOS_S3_ENDPOINT:}
# Tope en segundos de cada llamada al almacenamiento (con sus reintentos); si no responde, 503
gestilab.fotos.s3.timeout-segundos=${FOTOS_S3_TIMEOUT_SEGUNDOS:10}

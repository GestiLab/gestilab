# Perfil por defecto: H2 en memoria (modo PostgreSQL) + datos iniciales de desarrollo.
spring:
  application:
    name: inventario-service
  datasource:
    url: jdbc:h2:mem:inventario;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway, Hibernate solo lo verifica
  flyway:
    locations: classpath:db/migration,classpath:db/seed

server:
  port: 8081

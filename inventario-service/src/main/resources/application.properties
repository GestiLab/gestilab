spring.application.name=inventario-service
api.version=v1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/inventario_db}
spring.datasource.username=${DB_USERNAME:devdb}
spring.datasource.password=${DB_PASSWORD:devdb}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.pool-name=InventarioHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSON estricto: sin esto {"tipoEquipoId":1.9} crea la unidad en el tipo 1 y la basura tras el JSON se ignora
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false

# RabbitMQ: el exchange comparte el nombre y routing key con prestamos-service.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
gestilab.rabbitmq.unidad.exchange=gestilab.unidades.eventos
gestilab.rabbitmq.unidad.routing-key=unidad.estado.cambiado
gestilab.rabbitmq.unidad.cola=inventario.unidad-estado
gestilab.eventos.consumidor.habilitado=true
management.health.rabbit.enabled=false

# Actuator en puerto propio (ver tabla de puertos del README raíz): /salud
management.server.port=8081
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=salud
management.endpoints.web.exposure.include=health

# Seguridad (SCRUM-20): se valida el token que emite Keycloak y se leen los roles de realm_access.roles.
# issuer es el "iss" que trae el token; jwk-set-uri es de dónde se descargan las claves públicas.
# Con el servicio en un contenedor no coinciden (ver keycloak/README.md): se cambian por variable de entorno.
# La descarga de claves es perezosa: el servicio arranca aunque Keycloak todavía no responda.
gestilab.seguridad.issuer=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gestilab}
gestilab.seguridad.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gestilab}/protocol/openid-connect/certs}

logging.level.com.tedesoft.inventarioservice=DEBUG

name: CI - GestiLab

# Ejecutar en cada push y pull request
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      # Descargar el codigo del repositorio
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Preparar Java 21 y Maven
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            inventario-service/pom.xml
            prestamos-service/pom.xml

      # Compilar y ejecutar pruebas de inventario
      - name: Probar inventario-service
        run: mvn -B -ntp -f inventario-service/pom.xml clean verify

      # Compilar y ejecutar pruebas de prestamos
      - name: Probar prestamos-service
        run: mvn -B -ntp -f prestamos-service/pom.xml clean verify

  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - inventario-service
          - prestamos-service

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: gestilab/${{ matrix.service }}:ci

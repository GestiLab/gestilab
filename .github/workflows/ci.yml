
name: CI - GestiLab

# Ejecutar en pull requests y en pushes a main.
# Los pushes a ramas con PR abierto ya los cubre el evento pull_request.
on:
  push:
    branches: [main]
  pull_request:

# Cancelar ejecuciones obsoletas de la misma rama o PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      # Descargar el codigo del repositorio
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Preparar Java 21 y Maven
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            inventario-service/pom.xml
            prestamos-service/pom.xml

      # Compilar y ejecutar pruebas de inventario
      - name: Probar inventario-service
        run: mvn -B -ntp -f inventario-service/pom.xml clean verify

      # Compilar y ejecutar pruebas de prestamos
      - name: Probar prestamos-service
        run: mvn -B -ntp -f prestamos-service/pom.xml clean verify

  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: inventario-service
            db: inventario_db
            health_port: 8081
          - service: prestamos-service
            db: prestamos_db
            health_port: 8091

    # Base de datos real para comprobar que el contenedor arranca
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devdb
          POSTGRES_PASSWORD: devdb
          POSTGRES_DB: ${{ matrix.db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: gestilab/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Levantar el contenedor y verificar /salud
      - name: Verificar que el contenedor arranca (/salud)
        run: |
          docker run -d --name app --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/${{ matrix.db }} \
            -e DB_USERNAME=devdb -e DB_PASSWORD=devdb \
            gestilab/${{ matrix.service }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:${{ matrix.health_port }}/salud; then
              echo; echo "Servicio saludable"; exit 0
            fi
            sleep 3
          done
          echo "El servicio no respondio en /salud"
          docker logs app
          exit 1

# inventario-service tal como está en main. La imagen se construye con su Dockerfile y se carga en kind
# (desplegar.sh), por eso imagePullPolicy: Never. La configuración viene del ConfigMap inventario-config y
# las credenciales del Secret gestilab-credenciales.
apiVersion: v1
kind: Service
metadata:
  name: inventario-service
spec:
  selector:
    app: inventario-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: gestion
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-service
  template:
    metadata:
      labels:
        app: inventario-service
    spec:
      initContainers:
        - name: esperar-base
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-inventario 5432; do echo esperando la base; sleep 2; done"]
      containers:
        - name: inventario-service
          image: gestilab/inventario-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: gestion
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: inventario-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gestilab-credenciales
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestilab-credenciales
                  key: DB_PASSWORD
          # /salud incluye la base de datos (README raíz): listo solo si la base responde
          startupProbe:
            httpGet:
              path: /salud
              port: gestion
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: gestion
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /salud
              port: gestion
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi

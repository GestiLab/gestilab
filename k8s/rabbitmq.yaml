# RabbitMQ: prestamos-service publica aquí el evento UnidadCambioDeEstado (D-13). Sin volumen: el buzón de
# eventos pendientes vive en la base de préstamos, así que reiniciar el corredor no pierde eventos.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: gestion
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: gestilab-credenciales
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: gestilab-credenciales
                  key: RABBITMQ_PASSWORD
          # Sonda por puerto y no con rabbitmq-diagnostics: ese comando corre como root y, si se adelanta al
          # servidor, crea /var/lib/rabbitmq/.erlang.cookie con dueño root y RabbitMQ ya no arranca (eacces)
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi

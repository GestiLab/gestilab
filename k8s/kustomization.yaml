# GestiLab en Kubernetes (SCRUM-41, parte 1 de 2): infraestructura y los dos servicios tal como están en main.
# Se aplica con ./k8s/desplegar.sh, que crea el clúster kind, construye las imágenes y ejecuta
# `kubectl apply -k k8s/`. Ver k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gestilab

resources:
  - namespace.yaml
  - postgres.yaml
  - keycloak.yaml
  - rabbitmq.yaml
  - seaweedfs.yaml
  - inventario-service.yaml
  - prestamos-service.yaml

# El ConfigMap keycloak-realm no se genera aquí: kustomize no lee archivos fuera de k8s/ y el realm vive en
# keycloak/gestilab-realm.json (una sola fuente). Lo crea desplegar.sh desde ese archivo.

# Configuración de cada servicio (sin secretos). Las variables son las que ya leen los application.properties.
configMapGenerator:
  - name: inventario-config
    literals:
      - DB_URL=jdbc:postgresql://postgres-inventario:5432/inventario_db
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
  - name: prestamos-config
    literals:
      - DB_URL=jdbc:postgresql://postgres-prestamos:5432/prestamos_db
      - INVENTARIO_URL=http://inventario-service:8080/api/v1/inventario-service
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - FOTOS_S3_HABILITADO=true
      - FOTOS_S3_BUCKET=gestilab-fotos
      - FOTOS_S3_ENDPOINT=http://seaweedfs:8333
      - AWS_REGION=us-east-1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75

secretGenerator:
  - name: gestilab-credenciales
    envs:
      - valores-de-prueba.env

labels:
  - pairs:
      app.kubernetes.io/part-of: gestilab

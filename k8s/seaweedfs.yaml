# Almacenamiento compatible con S3 para las fotos (SCRUM-22). SeaweedFS en modo servidor único: maestro,
# volumen, filer y la pasarela S3 (puerto 8333) en un solo pod. MinIO dejó de publicar imágenes (D-14).
# Las credenciales S3 salen del Secret: el archivo de identidades se escribe al arrancar.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: maestro
      port: 9333
      targetPort: 9333
    - name: maestro-grpc
      port: 19333
      targetPort: 19333
    - name: filer
      port: 8888
      targetPort: 8888
    - name: filer-grpc
      port: 18888
      targetPort: 18888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.05
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /tmp/s3.json <<EOF
              {"identities": [{"name": "prestamos-service",
                "credentials": [{"accessKey": "$S3_ACCESS_KEY", "secretKey": "$S3_SECRET_KEY"}],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
              EOF
              # -ip con la IP del pod: el volumen (puerto 8080) se anuncia a sí mismo y el filer y la pasarela
              # S3, que corren en el mismo pod, le escriben sin pasar por el Service
              exec weed server -dir=/data -ip="$POD_IP" -ip.bind=0.0.0.0 \
                -master.volumeSizeLimitMB=64 -volume.max=0 \
                -s3 -s3.port=8333 -s3.config=/tmp/s3.json
          ports:
            - containerPort: 8333
            - containerPort: 9333
            - containerPort: 19333
            - containerPort: 8888
            - containerPort: 18888
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gestilab-credenciales
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gestilab-credenciales
                  key: S3_SECRET_KEY
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datos
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Crea el bucket de las fotos cuando SeaweedFS ya responde. Es idempotente: si el bucket existe, no falla.
apiVersion: batch/v1
kind: Job
metadata:
  name: crear-bucket-fotos
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: crear-bucket
          image: chrislusf/seaweedfs:4.05
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 >/dev/null 2>&1; do
                echo "esperando a SeaweedFS"; sleep 3
              done
              if ! echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -q gestilab-fotos; then
                echo "s3.bucket.create -name gestilab-fotos" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
              fi
              echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep gestilab-fotos
